apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:angelpixel-core/chatbot-ai-rag-langchain.git
    targetRevision: main
    path: infra/delivery/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
