apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:angelpixel-core/chatbot-ai-rag-langchain.git
    targetRevision: main
    path: infra/delivery/user-apps/overlays/nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
