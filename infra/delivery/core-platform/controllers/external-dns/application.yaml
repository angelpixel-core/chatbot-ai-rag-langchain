apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.14.5
    helm:
      values: |
        provider: aws
        policy: upsert-only
        registry: txt
        txtOwnerId: chatbot-nonprod
        sources:
          - ingress
        domainFilters:
          - example.com
        interval: 1m
        extraArgs:
          - --aws-zone-type=public
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
