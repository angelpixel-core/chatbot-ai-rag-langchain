apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coffee-chatbot-runtime

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: runtime-config
    envs:
      - ./inputs/core.env

secretGenerator:
  - name: runtime-secrets
    envs:
      - ./inputs/db.env

images:
  - name: django
    newName: coffee-chatbot-services
    newTag: local
  - name: nextjs
    newName: coffee-chatbot-web
    newTag: local

replicas:
  - name: django
    count: 1
  - name: nextjs
    count: 1

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: nextjs
