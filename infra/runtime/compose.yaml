services:
  services:
    build:
      context: ../..
      dockerfile: infra/runtime/containers/services/Dockerfile
      target: "${SERVICES_IMAGE_STAGE:-base}"
      args:
        PYTHON_VERSION: "${PYTHON_VERSION:-3.15.0rc1}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        SERVICES_PORT: "${SERVICES_INTERNAL_PORT:-8000}"
    container_name: coffee-chatbot-services
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../../infra/environments/${STACK_ENV}/app/core.env
      - ../../infra/environments/${STACK_ENV}/app/db.env
      - ../../infra/environments/${STACK_ENV}/app/secrets.local.env
      - ../../infra/environments/${STACK_ENV}/db/secrets.local.env
      - ../../infra/environments/${STACK_ENV}/orchestration/secrets.local.env
      - ../../infra/environments/.local/${STACK_ENV}.env
    environment:
      DB_HOST: db
      DB_PORT: "${DB_INTERNAL_PORT:-5432}"
      SERVICES_PORT: "${SERVICES_INTERNAL_PORT:-8000}"
      RUN_DB_PREPARE: "1"
    volumes:
      - ../..:/app
    entrypoint: ["/bin/sh", "/app/infra/runtime/containers/services/entrypoint.sh"]
    command: ["python", "apps/services/chatbot/manage.py", "runserver", "0.0.0.0:${SERVICES_INTERNAL_PORT:-8000}"]
    ports:
      - "${SERVICES_PORT:-10001}:${SERVICES_INTERNAL_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVICES_INTERNAL_PORT:-8000}/admin/ >/dev/null || curl -fsS http://127.0.0.1:${SERVICES_INTERNAL_PORT:-8000}/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - coffee_chatbot_net

  web:
    build:
      context: ../..
      dockerfile: infra/runtime/containers/web/Dockerfile
      args:
        NODE_VERSION: "${NODE_VERSION:-22.0.0}"
        WEB_PORT: "${WEB_INTERNAL_PORT:-3000}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    container_name: coffee-chatbot-web
    depends_on:
      services:
        condition: service_started
    env_file:
      - ../../infra/environments/${STACK_ENV}/app/core.env
      - ../../infra/environments/${STACK_ENV}/app/secrets.local.env
      - ../../infra/environments/${STACK_ENV}/orchestration/secrets.local.env
      - ../../infra/environments/.local/${STACK_ENV}.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://services:${SERVICES_INTERNAL_PORT:-8000}}"
      WEB_PORT: "${WEB_INTERNAL_PORT:-3000}"
    volumes:
      - ../..:/app
    ports:
      - "${WEB_PORT:-10002}:${WEB_INTERNAL_PORT:-3000}"
    networks:
      - coffee_chatbot_net

  db:
    image: postgres:${POSTGRES_VERSION:-16.4}-alpine
    container_name: coffee-chatbot-db
    env_file:
      - ../../infra/environments/${STACK_ENV}/db/bootstrap.env
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-coffee_chatbot_development}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app_password}"
    command: ["postgres", "-p", "${DB_INTERNAL_PORT:-5432}"]
    ports:
      - "${DB_PORT:-10003}:${DB_INTERNAL_PORT:-5432}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-coffee_chatbot_development} -p ${DB_INTERNAL_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - coffee_chatbot_net

volumes:
  db_data:
    name: coffee_chatbot_db_data

networks:
  coffee_chatbot_net:
    name: coffee_chatbot_net
    driver: bridge
