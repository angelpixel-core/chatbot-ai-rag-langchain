[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-ai-rag-langchain"
version = "0.1.0"
description = "Coffee chatbot backend and web client"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "gunicorn>=22.0",
    "psycopg[c]>=3.2",
    "python-dotenv>=1.0",
]

[tool.setuptools]
include-package-data = true
